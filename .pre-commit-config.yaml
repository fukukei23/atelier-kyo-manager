repos:
  # 1) ruff: lint (auto-fix) + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff
        name: ruff lint (auto-fix)
        args: ["--fix"]
        types_or: [python]
        exclude: |
          (?x)(
            ^migrations/.* |
            ^export/.* |
            ^exports_atelier/.* |
            ^\.venv/.* | ^venv/.* | ^\.venv_backup/.*
          )
      - id: ruff-format
        name: ruff format
        types_or: [python]
        exclude: |
          (?x)(
            ^migrations/.* |
            ^export/.* |
            ^exports_atelier/.* |
            ^\.venv/.* | ^venv/.* | ^\.venv_backup/.*
          )

  # 2) NBSP/TAB fix (ruff does not handle non-breaking spaces in indentation)
  - repo: local
    hooks:
      - id: fix-indent-nbsp
        name: fix NBSP/TAB in leading indentation (auto-fix)
        entry: python scripts/fix_indent_nbsp.py
        language: python
        types: [python]
        pass_filenames: true
        exclude: |
          (?x)(
            ^migrations/.* |
            ^export/.* |
            ^exports_atelier/.* |
            ^\.venv/.* | ^venv/.* | ^\.venv_backup/.*
          )

  # 3) NBSP/TAB verify (catches what ruff misses)
  - repo: local
    hooks:
      - id: forbid-nbsp-indent
        name: forbid NBSP/TAB in indent (verify after fix)
        entry: python scripts/check_nbsp.py
        language: python
        types: [python]
        pass_filenames: true
        exclude: |
          (?x)(
            ^migrations/.* |
            ^export/.* |
            ^exports_atelier/.* |
            ^\.venv/.* | ^venv/.* | ^\.venv_backup/.*
          )
