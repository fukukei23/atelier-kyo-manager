# mypy 設定 — ISSUE-101/102 Phase1 T4（段階的 strict 導入）
#
# Phase1 は app/core/pricing のみ strict（信頼性ゲートの根幹層）。
# follow_imports = skip で app/ 全体（routes 等 未型付け層）への波及を遮断。
# Phase2 以降で対象を拡大する（T6/T7/T8 で触る services/models から）。

[mypy]
python_version = 3.12
files = app/core/pricing
follow_imports = skip

# --- strict 相当（app/core/pricing のみに適用） ---
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True
extra_checks = True
