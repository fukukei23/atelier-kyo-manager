[pytest]
# pytest 設定ファイル

# テスト検索パターン
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 出力オプション
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:randomly

# マーカー定義（実使用の asyncio のみ・integration/unit/slow/skip は実使用0件で削除・
# skip は組み込みマーカーのため定義不要・2026-09-06 依存不整合掃除）
markers =
    asyncio: 非同期テスト

# テスト検索ディレクトリ
testpaths = tests

# ログ設定（オプション）
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

