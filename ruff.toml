# ruff.toml — atelier-kyo-manager
#
# 段階的にignoreを減らして品質を向上させる方針:
#   Phase 1 (現在): CI通過を最優先。既存コードのスタイル違反はignore。
#   Phase 2 (今後): ignoreルールを1つずつ外し、個別修正→コミット。

target-version = "py310"
line-length = 120

extend-exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "instance/",
    "export/",
    "exports/",
    "exports_atelier/",
    "output/",
    "project-root/",
    "catalog_images/",
    "debug_catalog/",
    "data/",
    "tmp/",
    "static/",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # --- Phase 1: 既存コードで多用されており一括修正困難 ---
    "E501",   # line too long (formatterが扱う)
    "E701",   # multiple statements on one line (colon) — mock class definitions
    "E702",   # multiple statements on one line (semicolon)
    "E402",   # module level import not at top — try/except import guards
    "F401",   # unused import — availability checks in try/except
    "F403",   # undefined name with star import
    "F406",   # undefined name with star import from
    "F821",   # undefined name — forward references, conditional imports
    "B008",   # function call in argument defaults
    "B023",   # loop variable binding in lambda
    "B025",   # duplicate exception in try/except
    "B904",   # raise without from in except
    "B905",   # zip() without strict
    "E741",   # ambiguous variable name
    "SIM102", # if-with-same-arms
    "SIM105", # try-except-pass → suppress
    "SIM108", # ternary operator
    "SIM117", # with statement merging
    "UP007",  # Union → X | Y (Python 3.10+)
    "UP035",  # typing.Dict → dict (deprecated import)
    "UP045",  # Optional → X | None
    "B007",   # unused loop control variable
    "F841",   # assigned but never used
]
fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
