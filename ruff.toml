# ruff.toml — atelier-kyo-manager
#
# 段階的にignoreを減らして品質を向上させる方針:
#   Phase 1 (現在): CI通過を最優先。既存コードのスタイル違反はignore。
#   Phase 2 (今後): ignoreルールを1つずつ外し、個別修正→コミット。

target-version = "py310"
line-length = 120

extend-exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "instance/",
    "export/",
    "exports/",
    "exports_atelier/",
    "output/",
    "project-root/",
    "catalog_images/",
    "debug_catalog/",
    "data/",
    "tmp/",
    "static/",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # --- Phase 2: 残存する違反（段階的に削減） ---
    "E501",   # line too long (formatterが扱う)
    "E402",   # module level import not at top — try/except import guards
    "F401",   # unused import — availability checks in try/except
    "F403",   # undefined name with star import
    "F406",   # undefined name with star import from
    "F821",   # undefined name — forward references, conditional imports
    "B023",   # loop variable binding in lambda
    "SIM102", # if-with-same-arms
    "SIM108", # ternary operator
    "SIM117", # with statement merging
]
fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
