# ruff.toml — atelier-kyo-manager
#
# 段階的にignoreを減らして品質を向上させる方針:
#   Phase 1 (現在): CI通過を最優先。既存コードのスタイル違反はignore。
#   Phase 2 (今後): ignoreルールを1つずつ外し、個別修正→コミット。

target-version = "py310"
line-length = 120

extend-exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "instance/",
    "export/",
    "exports/",
    "exports_atelier/",
    "output/",
    "project-root/",
    "catalog_images/",
    "debug_catalog/",
    "data/",
    "tmp/",
    "static/",
]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # --- 残存する違反 ---
    "E501",   # line too long (formatterが扱う、長い文字列/JSコード残存)
    "E402",   # module level import not at top — try/except import guards
    "F821",   # undefined name — forward references, conditional imports
]
fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
