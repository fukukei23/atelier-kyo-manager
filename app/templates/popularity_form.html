{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">人気度記録</h1>

    <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">商品ID <span class="text-red-500">*</span></label>
                <input type="number" name="product_id" required class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">記録日</label>
                <input type="date" name="tracking_date" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">閲覧数</label>
                <input type="number" name="views" min="0" value="0" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">お気に入り数</label>
                <input type="number" name="favorites" min="0" value="0" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">問い合わせ数</label>
                <input type="number" name="inquiries" min="0" value="0" class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">販売数</label>
                <input type="number" name="sold_count" min="0" value="0" class="w-full border rounded px-3 py-2">
            </div>
        </div>
        <div class="flex gap-2 mt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">登録</button>
            <a href="{{ url_for('main.popularity_list') }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
