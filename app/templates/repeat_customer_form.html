{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {% if customer %}顧客編集{% else %}新規顧客登録{% endif %}
    </h1>

    <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">顧客名 <span class="text-red-500">*</span></label>
                <input type="text" name="customer_name" required
                       value="{{ customer.customer_name if customer else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">メール</label>
                <input type="email" name="email"
                       value="{{ customer.email if customer else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">電話</label>
                <input type="tel" name="phone"
                       value="{{ customer.phone if customer else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">総注文数</label>
                <input type="number" name="total_orders" min="0"
                       value="{{ customer.total_orders if customer else 0 }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">総購入額</label>
                <input type="number" name="total_spent" step="0.01"
                       value="{{ customer.total_spent if customer else 0 }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">初回注文日</label>
                <input type="date" name="first_order_date"
                       value="{{ customer.first_order_date.isoformat() if customer and customer.first_order_date else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">最終注文日</label>
                <input type="date" name="last_order_date"
                       value="{{ customer.last_order_date.isoformat() if customer and customer.last_order_date else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">メモ</label>
            <textarea name="notes" rows="3" class="w-full border rounded px-3 py-2">{{ customer.notes if customer else '' }}</textarea>
        </div>

        <div class="flex gap-2 mt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                {% if customer %}更新{% else %}登録{% endif %}
            </button>
            <a href="{{ url_for('main.customer_list') }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
