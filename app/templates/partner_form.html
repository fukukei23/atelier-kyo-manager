{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {% if partner %}パートナー編集{% else %}新規パートナー{% endif %}
    </h1>

    <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">名前 <span class="text-red-500">*</span></label>
                <input type="text" name="name" value="{{ partner.name if partner else '' }}"
                       required class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">メール</label>
                <input type="email" name="email" value="{{ partner.email if partner else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">電話</label>
                <input type="tel" name="phone" value="{{ partner.phone if partner else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">優先度</label>
                <select name="priority_level" class="w-full border rounded px-3 py-2">
                    <option value="high" {% if partner and partner.priority_level == 'high' %}selected{% endif %}>高</option>
                    <option value="medium" {% if not partner or partner.priority_level == 'medium' %}selected{% endif %}>中</option>
                    <option value="low" {% if partner and partner.priority_level == 'low' %}selected{% endif %}>低</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">対応地域（カンマ区切り）</label>
            <input type="text" name="active_regions"
                   value="{{ partner.active_regions if partner else '' }}"
                   placeholder="例: HK, TW, KR"
                   class="w-full border rounded px-3 py-2">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">得意ブランド（カンマ区切り）</label>
            <input type="text" name="specialty_brands"
                   value="{{ partner.specialty_brands if partner else '' }}"
                   placeholder="例: Chanel, Hermes, Louis Vuitton"
                   class="w-full border rounded px-3 py-2">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">応答スコア (1-5)</label>
                <input type="number" name="response_speed_score" min="1" max="5"
                       value="{{ partner.response_speed_score if partner else 3 }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ステータス</label>
                <select name="status" class="w-full border rounded px-3 py-2">
                    <option value="active" {% if not partner or partner.status == 'active' %}selected{% endif %}>稼働</option>
                    <option value="inactive" {% if partner and partner.status == 'inactive' %}selected{% endif %}>停止</option>
                    <option value="suspended" {% if partner and partner.status == 'suspended' %}selected{% endif %}>保留</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">メモ</label>
            <textarea name="notes" rows="3" class="w-full border rounded px-3 py-2">{{ partner.notes if partner else '' }}</textarea>
        </div>

        <div class="flex gap-2 mt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                {% if partner %}更新{% else %}登録{% endif %}
            </button>
            <a href="{{ url_for('main.partner_list') }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
