<!-- ======================================================================
 ファイル: templates/list.html
 概要   : 登録データ一覧
====================================================================== -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>データ一覧</title>
</head>
<body>
    <h1>登録データ一覧</h1>
    {% if items %}
        <ul>
        {% for item in items %}
            <li>
                <strong>{{ item.name }}</strong> - {{ item.description }}
                <form action="{{ url_for('main.delete_item', item_id=item.id) }}" method="POST" style="display:inline;">
                    <button type="submit">削除</button>
                </form>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>登録データはありません。</p>
    {% endif %}
    <p><a href="{{ url_for('main.index') }}">戻る</a></p>
</body>
</html>
