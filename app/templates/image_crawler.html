{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4 text-gray-800">個別リサーチツール</h1>

<!-- 既存の入力UIがあればこの上や下に残してOK -->

<section class="bg-white p-4 rounded shadow mt-6">
  <h2 class="text-xl font-semibold mb-3">Buyandship 倉庫を取得</h2>

  <div class="flex items-center gap-3 mb-3">
    <label for="country" class="text-sm text-gray-700">国コード</label>
    <select id="country" class="border rounded px-2 py-1">
      <option value="US">US</option>
      <option value="UK">UK</option>
      <option value="JP">JP</option>
      <option value="AU">AU</option>
      <option value="CA">CA</option>
    </select>
    <button id="fetchWH" class="px-3 py-1 bg-blue-600 text-white rounded">倉庫取得</button>
  </div>

  <div id="whResult" class="text-sm text-gray-700"></div>
</section>

<script>
document.getElementById('fetchWH').addEventListener('click', async () => {
  const c = document.getElementById('country').value;
  const box = document.getElementById('whResult');
  box.textContent = '取得中…';
  try {
    const res = await fetch(`/api/warehouses?country=${encodeURIComponent(c)}`);
    const json = await res.json();

    if (!res.ok) {
      box.textContent = json.error || 'エラーが発生しました';
      return;
    }
    if (!json.warehouses || json.warehouses.length === 0) {
      box.textContent = '該当の倉庫が見つかりませんでした。';
      return;
    }

    const rows = json.warehouses.map(w =>
      `<tr>
        <td class="border px-2 py-1">${w.name ?? ''}</td>
        <td class="border px-2 py-1 whitespace-pre-wrap">${w.address ?? ''}</td>
        <td class="border px-2 py-1">${w.country ?? ''}</td>
        <td class="border px-2 py-1">${(w.fee ?? '')}</td>
      </tr>`
    ).join('');

    box.innerHTML = `
      <table class="table-auto border-collapse border border-gray-300 mt-2 w-full">
        <thead>
          <tr class="bg-gray-100">
            <th class="border px-2 py-1 text-left">倉庫名</th>
            <th class="border px-2 py-1 text-left">住所</th>
            <th class="border px-2 py-1 text-left">国</th>
            <th class="border px-2 py-1 text-left">手数料(参考)</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (e) {
    box.textContent = 'ネットワークエラー: ' + e;
  }
});
</script>
{% endblock %}
