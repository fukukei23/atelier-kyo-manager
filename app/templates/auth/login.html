{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white dark:bg-gray-900 rounded-lg shadow-lg p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Atelier Kyo Manager</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">ログイン</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ユーザー名</label>
                <input type="text" id="username" name="username"
                       class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                              bg-white dark:bg-gray-800 text-gray-800 dark:text-white
                              focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="ユーザー名を入力" required autofocus>
            </div>

            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">パスワード</label>
                <input type="password" id="password" name="password"
                       class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg
                              bg-white dark:bg-gray-800 text-gray-800 dark:text-white
                              focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="パスワードを入力" required>
            </div>

            <button type="submit"
                    class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg
                           transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                ログイン
            </button>
        </form>
    </div>
</div>
{% endblock %}
