{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-6 text-gray-800">FAQテンプレート新規作成</h1>

<form method="POST" class="max-w-2xl space-y-6">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div>
    <label for="category" class="block text-sm font-medium text-gray-700 mb-1">カテゴリ</label>
    <input type="text" id="category" name="category" value="general"
           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
  </div>

  <div>
    <label for="question_pattern" class="block text-sm font-medium text-gray-700 mb-1">キーワードパターン <span class="text-red-500">*</span></label>
    <p class="text-xs text-gray-500 mb-1">カンマ区切りで複数指定可（例: 送料,配送,届かない）</p>
    <textarea id="question_pattern" name="question_pattern" rows="3"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"></textarea>
  </div>

  <div>
    <label for="answer_template" class="block text-sm font-medium text-gray-700 mb-1">返答テンプレート <span class="text-red-500">*</span></label>
    <p class="text-xs text-gray-500 mb-1">{product_name}等のプレースホルダー使用可</p>
    <textarea id="answer_template" name="answer_template" rows="5"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y"></textarea>
  </div>

  <div class="flex items-center gap-4">
    <button type="submit"
            class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">作成</button>
    <a href="{{ url_for('main.faq_templates') }}"
       class="text-sm text-gray-500 hover:text-gray-700 underline">戻る</a>
  </div>
</form>
{% endblock %}
