{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4 text-gray-800">出品文プレビュー</h1>

<div class="bg-white rounded-lg shadow-md p-6 mb-4">
  <div class="flex justify-between items-center mb-4">
    <div>
      <span class="text-lg font-semibold">{{ product.brand or '' }}</span>
      <span class="text-lg ml-2">{{ product.name }}</span>
    </div>
    <a href="{{ url_for('main.edit_product', product_id=product.id) }}" class="text-blue-600 hover:underline text-sm">商品編集</a>
  </div>

  <label class="block text-sm font-medium text-gray-700 mb-1">生成された出品文</label>
  <textarea id="listing-text" rows="12" readonly
            class="w-full border border-gray-300 rounded-md shadow-sm p-3 font-mono text-sm bg-gray-50">{{ listing_text }}</textarea>

  <div class="flex gap-3 mt-4">
    <button onclick="copyText()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">クリップボードにコピー</button>
    <a href="{{ url_for('main.generate_buyma_csv') }}" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">BUYMA CSV一括生成</a>
  </div>
</div>

<script>
function copyText() {
  const ta = document.getElementById('listing-text');
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = event.target;
    btn.textContent = 'コピーしました!';
    setTimeout(() => btn.textContent = 'クリップボードにコピー', 2000);
  });
}
</script>
{% endblock %}
