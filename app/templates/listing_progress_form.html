{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">品出し進捗 記録</h1>

    <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">日付</label>
                <input type="date" name="record_date"
                       value="{{ record.record_date.isoformat() if record and record.record_date else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">出品数 <span class="text-red-500">*</span></label>
                <input type="number" name="listings_count" min="0"
                       value="{{ record.listings_count if record else 0 }}"
                       required class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">1日目標</label>
                <input type="number" name="target_daily" min="1"
                       value="{{ record.target_daily if record else 20 }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">月間目標</label>
                <input type="number" name="target_monthly" min="1"
                       value="{{ record.target_monthly if record else 600 }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">月間累計</label>
                <input type="number" name="cumulative_monthly" min="0"
                       value="{{ record.cumulative_monthly if record else 0 }}"
                       class="w-full border rounded px-3 py-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">メモ</label>
            <textarea name="notes" rows="3" class="w-full border rounded px-3 py-2">{{ record.notes if record else '' }}</textarea>
        </div>

        <div class="flex gap-2 mt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">登録</button>
            <a href="{{ url_for('main.listing_progress_view') }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
