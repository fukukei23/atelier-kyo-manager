{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4 text-gray-800">FAQテンプレート管理</h1>

<div class="flex justify-end mb-4">
  <a href="{{ url_for('main.create_faq_template') }}"
     class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">新規作成</a>
</div>

{% if faqs %}
<div class="bg-white rounded-lg shadow-md overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-bold text-gray-700">カテゴリ</th>
        <th class="px-4 py-3 text-left text-xs font-bold text-gray-700">キーワードパターン</th>
        <th class="px-4 py-3 text-center text-xs font-bold text-gray-700">状態</th>
        <th class="px-4 py-3 text-center text-xs font-bold text-gray-700">操作</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
      {% for f in faqs %}
      <tr class="hover:bg-gray-50">
        <td class="px-4 py-3 text-sm">{{ f.category }}</td>
        <td class="px-4 py-3 text-sm">{{ f.question_pattern }}</td>
        <td class="px-4 py-3 text-center">
          {% if f.is_active %}
          <span class="inline-block px-2 py-0.5 text-xs font-medium bg-green-100 text-green-700 rounded-full">有効</span>
          {% else %}
          <span class="inline-block px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-500 rounded-full">無効</span>
          {% endif %}
        </td>
        <td class="px-4 py-3 text-center">
          <form method="POST" action="{{ url_for('main.delete_faq_template', fid=f.id) }}" class="inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="text-red-600 hover:underline text-sm" onclick="return confirm('削除しますか？')">削除</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
<div class="bg-white rounded-lg shadow-md p-8 text-center text-gray-500">
  FAQテンプレートがまだありません。「新規作成」から追加してください。
</div>
{% endif %}
{% endblock %}
