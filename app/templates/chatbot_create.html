{% extends "base.html" %}

{% block title %}新規問い合わせ作成{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="mb-6">
    <a href="{{ url_for('main.chatbot_dashboard') }}" class="text-blue-600 hover:underline">&larr; ダッシュボードに戻る</a>
  </div>

  <h1 class="text-2xl font-bold text-gray-800 mb-6">新規問い合わせ作成</h1>

  <div class="bg-white shadow-md rounded-lg p-6">
    <form method="POST">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="customer_name">顧客名</label>
        <input type="text" id="customer_name" name="customer_name"
               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="customer_email">メールアドレス</label>
        <input type="email" id="customer_email" name="customer_email"
               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="subject">件名 <span class="text-red-500">*</span></label>
        <input type="text" id="subject" name="subject" required
               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700">
      </div>

      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="message">本文 <span class="text-red-500">*</span></label>
        <textarea id="message" name="message" rows="6" required
                  class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700"></textarea>
      </div>

      <div class="flex items-center justify-between">
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded">
          問い合わせを処理
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
