{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">地域登録</h1>

    <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">地域コード <span class="text-red-500">*</span></label>
                <input type="text" name="region" required placeholder="HK, TW, KR..."
                       value="{{ region.region if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">地域名</label>
                <input type="text" name="region_name" placeholder="香港, 台湾, 韓国..."
                       value="{{ region.region_name if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">平均利益率(%)</label>
                <input type="number" name="avg_profit_rate" step="0.1"
                       value="{{ region.avg_profit_rate if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">平均配送日数</label>
                <input type="number" name="avg_shipping_days"
                       value="{{ region.avg_shipping_days if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">平均関税率(%)</label>
                <input type="number" name="avg_customs_rate" step="0.1"
                       value="{{ region.avg_customs_rate if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">リスクスコア(0-100)</label>
                <input type="number" name="risk_score" min="0" max="100"
                       value="{{ region.risk_score if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">信頼性スコア(0-100)</label>
                <input type="number" name="reliability_score" min="0" max="100"
                       value="{{ region.reliability_score if region else '' }}"
                       class="w-full border rounded px-3 py-2">
            </div>
        </div>
        <div class="flex gap-2 mt-4">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">登録</button>
            <a href="{{ url_for('main.region_list') }}" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
