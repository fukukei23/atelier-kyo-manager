<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <title>{{ brand }} 価格ダッシュボード (直近 {{ days }} 日)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;margin:16px;color:#222;background:#fdfdfd}
    h1{font-size:20px;margin:0 0 12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
    .card{border:1px solid #ddd;border-radius:8px;padding:12px}
    .title{font-size:14px;margin:0 0 8px}
    .alerts{color:#b00;font-size:12px;margin:6px 0 0;padding-left:18px}
    .row{margin-bottom:16px}
    .small{color:#666;font-size:12px}
  </style>
</head>

<body>
<h1>{{ brand }} 価格ダッシュボード <span class="small">(直近 {{ days }} 日)</span></h1>
<div class="row">
  <form method="get" action="/brand/{{ brand }}">
    日数: <input type="number" name="days" value="{{ days }}" min="7" max="365">
    <button type="submit">更新</button>
  </form>
</div>
<div id="cards" class="grid"></div>

<script>
async function load() {
  const resp = await fetch(`/api/history?brand={{ brand }}&days={{ days }}`);
  if (!resp.ok) {
    document.getElementById('cards').innerHTML = `<div class="card">APIエラー: ${resp.status}</div>`;
    return;
  }
  const data = await resp.json();
  const root = document.getElementById('cards');
  root.innerHTML = '';
  if (!data.series || data.series.length === 0) {
    root.innerHTML = `<div class="card">データがありません。まず price-history を実行してください。</div>`;
    return;
  }

  for (const s of data.series) {
    const card = document.createElement('div');
    card.className = 'card';
    const id = 'c_' + Math.random().toString(36).slice(2);
    card.innerHTML = `
      <div class="title"><a href="${s.url}" target="_blank" rel="noopener">${s.name || s.url}</a></div>
      <canvas id="${id}" height="180"></canvas>
      ${s.alerts && s.alerts.length ? `<ul class="alerts">${s.alerts.map(a => `<li>${a}</li>`).join('')}</ul>` : ''}
    `;
    root.appendChild(card);

    const ctx = document.getElementById(id).getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: s.labels, // ISO8601
        datasets: [
          { label: '価格',   data: s.prices, borderColor: '#1976d2', backgroundColor: 'rgba(25,118,210,0.08)', spanGaps: true, tension: 0.2 },
          { label: 'EMA7',   data: s.ema7,   borderColor: '#2e7d32', borderDash: [3,3], spanGaps: true, tension: 0.2, pointRadius: 0 },
          { label: 'EMA28',  data: s.ema28,  borderColor: '#ef6c00', borderDash: [6,3], spanGaps: true, tension: 0.2, pointRadius: 0 },
          { label: 'EMA180', data: s.ema180, borderColor: '#8844ff', borderDash: [10,4], spanGaps: true, tension: 0.2, pointRadius: 0, hidden: true },
          { label: 'EMA365', data: s.ema365, borderColor: '#ff4455', borderDash: [15,5], spanGaps: true, tension: 0.2, pointRadius: 0, hidden: true }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: { title: { display: false }, legend: { position: 'bottom' } },
        scales: {
          x: { type: 'time', time: { displayFormats: { day: 'MM/DD' } }, ticks: { maxTicksLimit: 7 } },
          y: { beginAtZero: false, ticks: { callback: v => '¥' + v.toLocaleString() } }
        }
      }
    });
  }
}
load();
</script>
</body>
</html>
