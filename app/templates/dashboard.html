<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <title>{{ brand }} 価格ダッシュボード (直近 {{ days }} 日)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body class="dark:bg-gray-900 dark:text-gray-100">
<h1 class="text-xl font-bold text-gray-800 dark:text-white mb-4">{{ brand }} 価格ダッシュボード <span class="small text-gray-500 dark:text-gray-400">(直近 {{ days }} 日)</span></h1>

<!-- コントロール bar -->
<div class="row mb-4">
  <div class="controls flex flex-wrap gap-3 items-center p-3 bg-white dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700">
    <form method="get" action="/brand/{{ brand }}" class="flex flex-wrap gap-2 items-center">
      <label class="text-sm text-gray-700 dark:text-gray-300">日数</label>
      <input type="number" name="days" value="{{ days }}" min="7" max="365" class="border border-gray-300 dark:border-gray-600 rounded px-2 py-1 w-16 text-sm dark:bg-gray-700 dark:text-white">
      <label class="text-sm text-gray-700 dark:text-gray-300 ml-2">仕入れ価格</label>
      <input type="number" name="purchase_price" placeholder="例: 50000" class="border border-gray-300 dark:border-gray-600 rounded px-2 py-1 w-24 text-sm dark:bg-gray-700 dark:text-white">
      <button type="submit" class="btn btn-primary">更新</button>
    </form>
    <button class="btn btn-secondary" onclick="exportData('csv')">CSV出力</button>
    <button class="btn btn-secondary" onclick="exportData('json')">JSON出力</button>
  </div>
</div>

<div id="summary" class="profit-summary" style="display:none">
  <h2>📊 収益性サマリー</h2>
  <div id="summary_grid" class="summary-grid"></div>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div> データを読み込み中...
</div>
<div id="error" class="error-state" style="display:none"></div>
<div id="cards" class="grid"></div>

<script>
let loadingDiv = document.getElementById('loading');
let errorDiv = document.getElementById('error');
let cardsDiv = document.getElementById('cards');
let summaryDiv = document.getElementById('summary');

async function load() {
  // ローディング表示
  loadingDiv.style.display = 'block';
  errorDiv.style.display = 'none';
  cardsDiv.innerHTML = '';
  summaryDiv.style.display = 'none';

  const params = new URLSearchParams({
    brand: '{{ brand }}',
    days: '{{ days }}'
  });
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('purchase_price')) {
    params.set('purchase_price', urlParams.get('purchase_price'));
  }

  try {
    const resp = await fetch(`/api/history?${params.toString()}`);
    if (!resp.ok) {
      throw new Error(`APIエラー: ${resp.status} ${resp.statusText}`);
    }

    const data = await resp.json();
    loadingDiv.style.display = 'none';

    if (!data.series || data.series.length === 0) {
      cardsDiv.innerHTML = `<div class="card">データがありません。まず price-history を実行してください。</div>`;
      return;
    }

    updateSummary(data.series);
    renderCards(data.series);

  } catch (err) {
    loadingDiv.style.display = 'none';
    errorDiv.style.display = 'block';
    errorDiv.innerHTML = `<strong>エラー:</strong> ${err.message}<br><small>ページを更新してください</small>`;
    console.error('Dashboard load error:', err);
  }
}

function renderCards(series) {
  for (let i = 0; i < series.length; i++) {
    const s = series[i];
    const card = document.createElement('div');
    card.className = 'card dark:bg-gray-800 dark:border-gray-700';

    const profit = s.profitability || {};
    const profitClass = getProfitClass(profit.current_profit_rate);
    const trendIcon = getTrendIcon(profit.trend_direction);
    const recBadge = getRecommendationBadge(profit.recommendation);

    const alertsHtml = s.alerts && s.alerts.length
      ? `<ul class="alerts dark:text-red-400">${s.alerts.map(a => `<li>${a}</li>`).join('')}</ul>`
      : '';

    card.innerHTML = `
      <div class="title dark:text-gray-100">
        <a href="${s.url}" target="_blank" rel="noopener" class="text-blue-600 dark:text-blue-400 hover:underline">${s.name || s.url}</a>
        ${recBadge}
        ${profit.current_profit_rate !== null && profit.current_profit_rate !== undefined
          ? `<span class="profit-badge ${profitClass}">${profit.current_profit_rate >= 0 ? '+' : ''}${profit.current_profit_rate}%</span>`
          : ''}
      </div>
      <canvas id="chart-${s.url ? s.url.replace(/[^a-zA-Z0-9]/g, '_').slice(0, 30) : 'product_' + i}" height="160"></canvas>
      ${alertsHtml}
      ${renderProfitabilityMeta(profit)}
    `;
    cardsDiv.appendChild(card);

    const canvasId = card.querySelector('canvas').id;
    renderChart(canvasId, s);
  }
  summaryDiv.style.display = 'block';
}

function getRecommendationBadge(rec) {
  if (!rec) return '';
  if (rec.includes('上昇') || rec.includes('仕入れ的最佳')) {
    return '<span class="inline-block px-2 py-0.5 text-xs rounded bg-green-100 text-green-800 dark:bg-green-900/50 dark:text-green-300 ml-2">买入シグナル</span>';
  }
  if (rec.includes('下跌') || rec.includes('销售的最佳')) {
    return '<span class="inline-block px-2 py-0.5 text-xs rounded bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300 ml-2">卖出シグナル</span>';
  }
  return '<span class="inline-block px-2 py-0.5 text-xs rounded bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400 ml-2">監視継続</span>';
}

function getProfitClass(rate) {
  if (rate === null || rate === undefined) return '';
  if (rate >= 15) return 'profit-high';
  if (rate >= 5) return 'profit-mid';
  if (rate >= 0) return 'profit-low';
  return 'profit-caution';
}

function getTrendIcon(direction) {
  if (direction === 'rising') return '📈';
  if (direction === 'falling') return '📉';
  return '➡️';
}

function renderProfitabilityMeta(profit) {
  if (!profit || Object.keys(profit).length === 0) return '';

  const items = [];

  if (profit.current_profit !== null && profit.current_profit !== undefined) {
    items.push(`<div class="meta-item"><span class="text-gray-500 dark:text-gray-400">推定利益</span><span class="font-medium ${profit.current_profit >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}">¥${profit.current_profit.toLocaleString()}</span></div>`);
  }
  if (profit.best_price_date) {
    items.push(`<div class="meta-item"><span class="text-gray-500 dark:text-gray-400">最安値</span><span class="text-gray-800 dark:text-gray-200">¥${profit.best_price?.toLocaleString()} (${formatDate(profit.best_price_date)})</span></div>`);
  }
  if (profit.price_volatility !== null && profit.price_volatility !== undefined) {
    const volClass = profit.price_volatility > 20 ? 'text-red-600' : profit.price_volatility > 10 ? 'text-amber-600' : 'text-green-600';
    items.push(`<div class="meta-item"><span class="text-gray-500 dark:text-gray-400">変動係数</span><span class="${volClass} dark:text-${volClass.replace('text-', 'gray-')}">${profit.price_volatility}%</span></div>`);
  }
  if (profit.trend_direction) {
    const icon = getTrendIcon(profit.trend_direction);
    items.push(`<div class="meta-item"><span class="text-gray-500 dark:text-gray-400">トレンド</span><span class="trend-${profit.trend_direction} dark:text-${profit.trend_direction === 'rising' ? 'red-400' : profit.trend_direction === 'falling' ? 'blue-400' : 'gray-400'}">${icon} ${profit.trend_direction}</span></div>`);
  }
  if (profit.recommendation) {
    items.push(`<div class="meta-item" style="grid-column:1/-1"><span class="text-gray-500 dark:text-gray-400">💡 推奨</span><span class="text-sm text-gray-700 dark:text-gray-200">${profit.recommendation}</span></div>`);
  }

  return items.length ? `<div class="meta-grid dark:bg-gray-700/50 dark:rounded">${items.join('')}</div>` : '';
}

function updateSummary(series) {
  const grid = document.getElementById('summary_grid');

  const profitable = series.filter(s => s.profitability?.current_profit_rate >= 10).length;
  const total = series.length;
  const avgProfitRate = series.reduce((sum, s) => sum + (s.profitability?.current_profit_rate || 0), 0) / (total || 1);
  const totalEstimatedProfit = series.reduce((sum, s) => sum + (s.profitability?.current_profit || 0), 0);

  grid.innerHTML = `
    <div class="summary-item dark:bg-gray-800 dark:border-gray-700">
      <div class="summary-label dark:text-gray-400">SKU数</div>
      <div class="summary-value dark:text-white">${total}</div>
    </div>
    <div class="summary-item dark:bg-gray-800 dark:border-gray-700">
      <div class="summary-label dark:text-gray-400">推奨SKU (利益率10%+)</div>
      <div class="summary-value positive dark:text-green-400">${profitable}/${total}</div>
    </div>
    <div class="summary-item dark:bg-gray-800 dark:border-gray-700">
      <div class="summary-label dark:text-gray-400">平均利益率</div>
      <div class="summary-value ${avgProfitRate >= 5 ? 'positive' : 'negative'} dark:text-${avgProfitRate >= 5 ? 'green-400' : 'red-400'}">${avgProfitRate >= 0 ? '+' : ''}${avgProfitRate.toFixed(1)}%</div>
    </div>
    <div class="summary-item dark:bg-gray-800 dark:border-gray-700">
      <div class="summary-label dark:text-gray-400">推定総利益</div>
      <div class="summary-value ${totalEstimatedProfit >= 0 ? 'positive' : 'negative'} dark:text-${totalEstimatedProfit >= 0 ? 'green-400' : 'red-400'}">¥${totalEstimatedProfit.toLocaleString()}</div>
    </div>
  `;
}

function renderChart(canvasId, s) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
  const tickColor = isDark ? '#9ca3af' : '#6b7280';
  new Chart(ctx.getContext('2d'), {
    type: 'line',
    data: {
      labels: s.labels,
      datasets: [
        { label: '価格', data: s.prices, borderColor: '#1976d2', backgroundColor: 'rgba(25,118,210,0.08)', spanGaps: true, tension: 0.2 },
        { label: 'EMA7', data: s.ema7, borderColor: '#2e7d32', borderDash: [3,3], spanGaps: true, tension: 0.2, pointRadius: 0 },
        { label: 'EMA28', data: s.ema28, borderColor: '#ef6c00', borderDash: [6,3], spanGaps: true, tension: 0.2, pointRadius: 0 },
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { title: { display: false }, legend: { position: 'bottom', labels: { color: tickColor } } },
      scales: {
        x: { ticks: { maxTicksLimit: 7, color: tickColor }, grid: { color: gridColor }, title: { display: false } },
        y: { beginAtZero: false, ticks: { callback: v => '¥' + v.toLocaleString(), color: tickColor }, grid: { color: gridColor } }
      }
    }
  });
}

function formatDate(isoString) {
  if (!isoString) return '';
  const d = new Date(isoString);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function exportData(format) {
  const params = new URLSearchParams({
    brand: '{{ brand }}',
    days: '{{ days }}',
    format: format
  });
  window.open(`/api/history/export?${params.toString()}`, '_blank');
}

load();
</script>
</body>
</html>
