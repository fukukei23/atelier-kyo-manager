<!--
==============================================================================
ファイル名 : auto_research.html
配置      : app/templates/
目的      : /auto-research 画面（フォーム未定義エラーを解消）
使い方    : 既存のファイルをこの内容で「全置換」→ 保存
==============================================================================
-->
{% extends "base.html" %}

{% block content %}
  <h1 class="text-2xl font-bold text-gray-800 mb-4">AI 自動リサーチ</h1>

  <div class="bg-white p-6 rounded-lg shadow">
    <p class="text-gray-600 mb-4">
      条件に基づいて自動でリサーチを行う画面です（内容は環境により実装差があります）。
    </p>

    <!-- CSRF を持つ最小フォーム。brand 等のフィールドはありません -->
    <form method="POST" class="space-y-4">
      {{ form.hidden_tag() }}
      {{ form.submit(class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700") }}
    </form>

    <hr class="my-6">

    <div>
      <h2 class="text-lg font-semibold mb-2">Buyandship 倉庫一覧（デモ）</h2>
      <div class="flex gap-2 items-center">
        <label for="country" class="text-sm text-gray-700">国コード:</label>
        <select id="country" class="border rounded px-2 py-1">
          <option value="HK">HK</option>
          <option value="TW">TW</option>
          <option value="JP">JP</option>
        </select>
        <button id="btnFetch" class="px-3 py-1 bg-gray-700 text-white rounded">取得</button>
      </div>
      <pre id="result" class="bg-gray-100 p-3 rounded mt-3 text-sm"></pre>
    </div>
  </div>

  <script>
    document.getElementById('btnFetch')?.addEventListener('click', async (e) => {
      e.preventDefault();
      const code = document.getElementById('country').value;
      const res = await fetch(`/api/warehouses?country=${encodeURIComponent(code)}`);
      document.getElementById('result').textContent = await res.text();
    });
  </script>
{% endblock %}
