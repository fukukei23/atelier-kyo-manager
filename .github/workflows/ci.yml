name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

env:
  FLASK_APP: app
  FLASK_ENV: testing

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check (lint)
        run: ruff check app/ tests/ scripts/ dev_tools/
      - name: ruff format (check)
        run: ruff format --check app/ tests/ scripts/ dev_tools/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/ -q --tb=short 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
