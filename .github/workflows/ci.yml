name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

env:
  FLASK_APP: app
  FLASK_ENV: testing

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check (lint)
        run: ruff check app/ tests/ scripts/ dev_tools/
      - name: ruff format (check)
        run: ruff format --check app/ tests/ scripts/ dev_tools/

  typecheck:
    name: "Type Check (mypy strict: pricing)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      # mypy.ini が app/core/pricing のみ strict 検査（ISSUE-101/102 Phase1 T4・段階的拡大）
      - name: Run mypy
        run: python -m mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: |
          set -o pipefail
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m pytest tests/ --cov=app --cov-report=term -q --tb=short 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
